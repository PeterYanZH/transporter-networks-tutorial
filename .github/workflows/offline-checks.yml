name: Offline teaching checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  numerical-and-download-checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install numerical dependency
        run: python -m pip install numpy==1.26.4
      - name: Shell syntax
        run: bash -n env.sh && find scripts -name '*.sh' -exec bash -n {} \;
      - name: Offline tests
        run: python -m unittest discover -s tests -v
      - name: Synthetic examples without models or fonts
        run: python teaching/scripts/toy_experiments.py --no-plots --out /tmp/transporter-toys
      - name: Compare numerical results with the teaching baseline
        run: python teaching/scripts/check_numerics.py
